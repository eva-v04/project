{% load static %}
<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'base.css' %}">
    <title>Generate Call Graph</title>
    <style>
        /*  στυλ μόνο για τη φόρμα */
        .form-group {
            margin-top: 30px;
            text-align: left;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 15px;
            margin-top: 8px;
            border: 2px solid #eee;
            border-radius: 14px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fdfdfd;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(72, 52, 212, 0.1);
            outline: none;
        }

        .helper-text {
            font-size: 0.85rem;
            color: #636e72;
            margin-top: 15px;
            display: block;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/callgraph">Jelly Analysis</a>
            <a href="/gasket">Gasket Bridges</a>
        </div>
    </nav>

    <div class="container-centered">
        <div class="glass-card">
            <h1>Jelly Engine</h1>
            <p>Generate Call Graphs for any NPM package.</p>
            
            <form action="/callgraph/" method="post" class="form-group">
                {% csrf_token %}
                <label for="package_name" style="font-weight: 700; color: var(--primary);">NPM Package Name</label>
                {{ form.package_name }}
                
                <span class="helper-text">💡 Example: <code>sqlite3</code>, <code>canvas</code>, or <code>b</code></span>
                
                <div style="margin-top: 30px;">
                    <button type="submit" class="btn-main" style="width: 100%; border: none; cursor: pointer;">
                        Generate Analysis
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
