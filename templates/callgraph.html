{% load static %}
<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'base.css' %}">
    <title>Generate Call Graph</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <h2>Project</h2>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'workspace' %}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'callgraph' %}">Jelly Analysis</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'gasket' %}">Gasket Bridges</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/analyses">My History</a>
                </li>
            </ul>
            
            <div class="d-flex align-items-center">
                <button id="theme-toggle" class="btn btn-link text-info me-3">
                    <i class="fa-solid fa-moon"></i>
                </button>
                
                <a href="{% url 'myacc' %}" class="me-3 text-decoration-none" style="color: var(--text-main);">
                    {{ user.username }} <i class="fa-regular fa-circle-user"></i>
                </a>
                <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm">Logout</a>
            </div>
        </div>
    </div>
    </nav>

    <div class="container-centered">
        <div class="glass-card">
            <h1>Jelly Engine</h1>
            <p>Generate Call Graphs for any NPM package.</p>
            
            <form action="/callgraph/" method="post" class="form-group">
                {% csrf_token %}
                <label for="package_name" style="font-weight: 700; color: var(--primary);">NPM Package Name</label>
                {{ form.package_name }}
                
                <span class="helper-text">💡 Example: <code>sqlite3</code>, <code>canvas</code>, or <code>b</code></span>
                
                <div style="margin-top: 30px;">
                    <button type="submit" class="btn-main" style="width: 100%; border: none; cursor: pointer;">
                        Generate Analysis
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script>
    const btn = document.getElementById('theme-toggle');
    const icon = btn.querySelector('i');
    const body = document.body;

    // Έλεγχος αν υπάρχει αποθηκευμένη προτίμηση
    if (localStorage.getItem('theme') === 'light') {
        body.classList.add('light-mode');
        icon.classList.replace('fa-moon', 'fa-sun');
    }

    btn.addEventListener('click', () => {
        body.classList.toggle('light-mode');
        
        if (body.classList.contains('light-mode')) {
            icon.classList.replace('fa-moon', 'fa-sun');
            localStorage.setItem('theme', 'light');
        } else {
            icon.classList.replace('fa-sun', 'fa-moon');
            localStorage.setItem('theme', 'dark');
        }
    });
</script>
</body>
</html>
