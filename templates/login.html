{% load static %}
<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'base.css' %}">
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        
        <div class="glass-card text-center" style="max-width: 400px; width: 100%;">
            <div class="mb-4">
                <i class="fa-solid fa-user-lock fa-3x text-primary"></i>
                <h2 class="mt-3 fw-bold">Καλώς Ήρθατε</h2>
                <p class="text-muted">Συνδεθείτε στον λογαριασμό σας</p>
            </div>

            <form action="/login/" method="post">
                {% csrf_token %}
                
                <div class="input-group mb-3">
                    <span class="input-group-text">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Το όνομα χρήστη σας" required>
                </div>

                <div class="text-start mb-4">
                    <label for="password" class="form-label small fw-bold">PASSWORD</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--glass-border);">
                            <i class="fa-solid fa-key text-muted"></i>
                        </span>
                        <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Ο κωδικός σας" required>
                    </div>
                </div>

                <button type="submit" class="btn-main w-100 py-2">ΕΙΣΟΔΟΣ</button>
            </form>

            <div class="mt-4 helper-text">
                Δεν έχετε λογαριασμό; <a href="/signup/" class="text-primary text-decoration-none fw-bold">Εγγραφείτε εδώ</a>
            </div>
            
            <a href="/" class="d-block mt-3 small text-muted text-decoration-none">
                <i class="fa-solid fa-arrow-left"></i> Επιστροφή στην Αρχική
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
