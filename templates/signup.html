{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Signup</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="{% static 'base.css' %}">
    </head>
    <body>
        <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
            <div class="glass-card text-center" style="max-width: 400px; width: 100%;">
                <div class="mb-4">
                    <i class="fa-solid fa-user-lock fa-3x text-primary"></i>
                    <h2 class="mt-3 fw-bold">Sign Up</h2>
                <p class="text-muted">Δημιουργήστε τον λογαριασμό σας</p>
            </div>

                <form action="/signup/" method="post">
                    {% csrf_token %}
                <div class="input-group mb-3">
                        <span class="input-group-text">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Το όνομα χρήστη σας" required>
                </div>

                <div class="text-start mb-4">
                    <label for="password" class="form-label small fw-bold">PASSWORD</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--glass-border);">
                            <i class="fa-solid fa-key text-muted"></i>
                        </span>
                        <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Ο κωδικός σας" required>
                    </div>
                </div>


                <div class="text-start mb-4">
                    <label for="email" class="form-label small fw-bold">EMAIL</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--glass-border);">
                            <i class="fa-solid fa-envelope text-muted"></i>
                        </span>
                        <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="Το email σας" required>
                    </div>

                <br><button type="submit" class="btn-main w-100 py-2">ΕΙΣΟΔΟΣ</button>
            </form> 

        <div class="mt-4 helper-text">
            Already have an account? <a href="/login/">Login here</a>
        </div>
    </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

        <script>
    const btn = document.getElementById('theme-toggle');
    const icon = btn.querySelector('i');
    const body = document.body;

    // Έλεγχος αποθηκευμένης προτίμησης
    if (localStorage.getItem('theme') === 'light') {
        body.classList.add('light-mode');
        if(icon) icon.classList.replace('fa-moon', 'fa-sun');
    }

    if (btn) {
        btn.addEventListener('click', () => {
            body.classList.toggle('light-mode');
            if (body.classList.contains('light-mode')) {
                icon.classList.replace('fa-moon', 'fa-sun');
                localStorage.setItem('theme', 'light');
            } else {
                icon.classList.replace('fa-sun', 'fa-moon');
                localStorage.setItem('theme', 'dark');
            }
        });
    }
</script>
    </body>
</html>
