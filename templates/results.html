{% load static %}
<!DOCTYPE html>
<html>
	<head>
			<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
            <link rel="stylesheet" href="{% static 'base.css' %}">
		    <title>Jelly Analysis Result: {{ package_name }}</title>
	</head>
	<body>
		<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <h2>Project</h2>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'workspace' %}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'callgraph' %}">Jelly Analysis</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'gasket' %}">Gasket Bridges</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/analyses">My History</a>
                </li>
            </ul>
            
            <div class="d-flex align-items-center">
                <button id="theme-toggle" class="btn btn-link text-info me-3">
                    <i class="fa-solid fa-moon"></i>
                </button>
                
                <a href="{% url 'myacc' %}" class="me-3 text-decoration-none" style="color: var(--text-main, white);">
                            {{ user.username }} <i class="fa-regular fa-circle-user"></i>
                        </a>
                        <i class="fa-solid fa-bell position-relative me-3" style="cursor: pointer;">
                            <a href="{% url 'notifications' %}" 
                            id="notification-badge" 
                            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" 
                            style="font-size: 0.5rem; {% if unread_count == 0 %}display: none;{% endif %}">
                            {{ unread_count }}
                        </a>
                        </i>
                <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm">Logout</a>
            </div>
        </div>
    </div>
    </nav>
		<div class="d-flex justify-content-between align-items-end mb-4 flex-wrap">
    <div>
        <h1 class="main-title text-start mb-0">Analysis for: <span class="text-primary">{{ package_name }}</span></h1>
        <p class="text-secondary small mb-0">Version: {{ package_version|default:"latest" }}</p>
    </div>

    <div class="mt-3 mt-md-0">
        <a href="{% static 'analysis_' %}{{ package_name }}_{{ package_version }}/{{ package_name }}.json" 
           download="{{ package_name }}_analysis.json" 
           class="btn btn-download-custom">
            <i class="fa-solid fa-file-export me-2"></i>Export JSON
        </a>
    </div>
</div>
		<hr>
<div class="jelly-iframe-container mt-4">
    <iframe src="{{ graph_url }}" width="100%" height="700px" frameborder="0"></iframe>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    const btn = document.getElementById('theme-toggle');
    const icon = btn.querySelector('i');
    const body = document.body;

    // Έλεγχος αποθηκευμένης προτίμησης
    if (localStorage.getItem('theme') === 'light') {
        body.classList.add('light-mode');
        if(icon) icon.classList.replace('fa-moon', 'fa-sun');
    }

    if (btn) {
        btn.addEventListener('click', () => {
            body.classList.toggle('light-mode');
            if (body.classList.contains('light-mode')) {
                icon.classList.replace('fa-moon', 'fa-sun');
                localStorage.setItem('theme', 'light');
            } else {
                icon.classList.replace('fa-sun', 'fa-moon');
                localStorage.setItem('theme', 'dark');
            }
        });
    }
</script>
<script src="{% static 'notifications.js' %}"></script>


<script>
const iframe = document.querySelector('iframe');

function updateIframeStyles() {
    try {
        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
        const isLight = document.body.classList.contains('light-mode');
        
        // Καθορισμός χρωμάτων
        const bgColor = isLight ? '#f1f5f9' : '#0f172a'; 
        const textColor = isLight ? '#000000' : '#ffffff'; 
        const nodeColor = isLight ? '#ffffff' : '#1e293b';

        const styleTag = iframeDoc.createElement('style');
        styleTag.innerHTML = `
            /* 1. Επιβολή φόντου στο body και στο container του visualizer */
            body, #container, .visualizer-root { 
                background-color: ${bgColor} !important; 
                color: ${textColor} !important; 
            }

            /* 2. Επιβολή χρώματος σε ΟΛΑ τα κείμενα (SVG και HTML) */
            text, tspan, span, div, label, p, h1, h2, h3 { 
                fill: ${textColor} !important; 
                color: ${textColor} !important; 
            }

            /* 3. Διόρθωση των κουμπιών και των input (Collapse, Expand, κλπ) */
            button, input, select {
                background-color: rgba(255, 255, 255, 0.1) !important;
                color: ${textColor} !important;
                border: 1px solid rgba(255, 255, 255, 0.2) !important;
                padding: 4px 8px !important;
                margin: 2px !important;
                cursor: pointer;
            }
            
            button:hover {
                background-color: rgba(255, 255, 255, 0.2) !important;
            }

            /* Διόρθωση των γραμμών και των σχημάτων του γραφήματος */
            path, line, polyline { 
                stroke: ${isLight ? '#334155' : '#94a3b8'} !important; 
            }
            
            rect, circle, ellipse {
                stroke: ${isLight ? '#334155' : '#38bdf8'} !important;
                fill: ${nodeColor} !important;
            }

            /* Διόρθωση για το "canvas" label που φαίνεται μαύρο στην εικόνα */
            .label, .node-label {
                fill: ${textColor} !important;
                color: ${textColor} !important;
            }
        `;
        
        const existingStyle = iframeDoc.querySelector('style');
        if (existingStyle) existingStyle.remove();
        iframeDoc.head.appendChild(styleTag);

    } catch (e) {
        console.warn("Cross-origin access blocked or iframe not ready.");
    }
}

// Εκτέλεση όταν φορτώσει
iframe.addEventListener('load', updateIframeStyles);

// Σύνδεση με το δικό σου Theme Toggle κουμπί
const themeBtn = document.getElementById('theme-toggle');
if (themeBtn) {
    themeBtn.addEventListener('click', () => {
        // Χρειάζεται μια μικρή καθυστέρηση για να προλάβει το body να πάρει την κλάση light-mode
        setTimeout(updateIframeStyles, 50);
    });
}
</script>
    </body>
</html>
