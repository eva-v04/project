{% load static %}
<!DOCTYPE html>
<html>
	<head>
			<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
            <link rel="stylesheet" href="{% static 'base.css' %}">
		    <title>Jelly Analysis Result: {{ package_name }}</title>
	</head>
	<body>
		<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <h2>Project</h2>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'workspace' %}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'callgraph' %}">Jelly Analysis</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'gasket' %}">Gasket Bridges</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/analyses">My History</a>
                </li>
            </ul>
            
            <div class="d-flex align-items-center">
                <button id="theme-toggle" class="btn btn-link text-info me-3">
                    <i class="fa-solid fa-moon"></i>
                </button>
                
                <a href="{% url 'myacc' %}" class="me-3 text-decoration-none" style="color: var(--text-main, white);">
                            {{ user.username }} <i class="fa-regular fa-circle-user"></i>
                        </a>
                        <i class="fa-solid fa-bell position-relative me-3" style="cursor: pointer;">
                            <a href="{% url 'notifications' %}" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.5rem;">2</a>
                        </i>
                <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm">Logout</a>
            </div>
        </div>
    </div>
    </nav>
		<h1>Αποτελέσματα Ανάλυσης για το πακέτο: {{ package_name }}</h1>
		<a href="{% url 'callgraph' %}">← Νέα Ανάλυση</a>
		<hr>
		<iframe src="{{ graph_url }}" width="100%" height="600px"></iframe>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    const btn = document.getElementById('theme-toggle');
    const icon = btn.querySelector('i');
    const body = document.body;

    // Έλεγχος αποθηκευμένης προτίμησης
    if (localStorage.getItem('theme') === 'light') {
        body.classList.add('light-mode');
        if(icon) icon.classList.replace('fa-moon', 'fa-sun');
    }

    if (btn) {
        btn.addEventListener('click', () => {
            body.classList.toggle('light-mode');
            if (body.classList.contains('light-mode')) {
                icon.classList.replace('fa-moon', 'fa-sun');
                localStorage.setItem('theme', 'light');
            } else {
                icon.classList.replace('fa-sun', 'fa-moon');
                localStorage.setItem('theme', 'dark');
            }
        });
    }
</script>
    </body>
</html>
