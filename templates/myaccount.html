{% load static %}
<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'base.css' %}">
</head>
<body class="{% if request.session.theme == 'light' %}light-mode{% endif %}">

    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <a href="{% url 'workspace' %}" class="navbar-brand mb-0 h1 text-decoration-none">
                <i class="fa-solid fa-square-n text-info me-2"></i>Project
            </a>
            <div class="d-flex align-items-center">
                <a href="{% url 'workspace' %}" class="btn btn-outline-info btn-sm me-3">Back to Workspace</a>
                <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container centered-container">
        <div class="glass-card text-center">
            <div class="mb-4">
                <i class="fa-regular fa-circle-user text-info" style="font-size: 5rem;"></i>
            </div>
            
            <h2 class="mb-4">ACCOUNT DETAILS</h2>

            {% if user %}
                <div class="text-start mb-4">
                    <div class="p-3 mb-2 rounded" style="background: rgba(255,255,255,0.05);">
                        <label class="small text-info fw-bold d-block">USERNAME</label>
                        <span class="fs-5">{{ user.username }}</span>
                    </div>
                    
                    <div class="p-3 mb-2 rounded" style="background: rgba(255,255,255,0.05);">
                        <label class="small text-info fw-bold d-block">EMAIL ADDRESS</label>
                        <span class="fs-5">{{ user.email }}</span>
                    </div>

                    <div class="p-3 mb-2 rounded" style="background: rgba(255,255,255,0.05);">
                        <label class="small text-info fw-bold d-block">TOTAL ANALYSES</label>
                        <span class="fs-5">{{ user.user_analyses.count }}</span> </div>
                </div>

                <a href="{% url 'workspace' %}" class="btn btn-launch w-100 py-3">VIEW MY ANALYSES</a>
            {% else %}
                <div class="alert alert-warning">
                    You are not logged in. <a href="{% url 'login' %}">Login here</a>.
                </div>
            {% endif %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
